blueprint:
  name: Müll-Reminder – MQTT Publish (WCS Sensoren)
  description: >
    Veröffentlicht die Anzahl der Tage bis zur nächsten Müllabholung
    direkt aus den ausgewählten Waste-Collection-Schedule-Sensoren per MQTT.
    Jeder Sensor entspricht genau einem Mülltyp. Nicht benötigte Müllarten
    können leer gelassen werden.
  domain: automation

  input:

    rest_sensor:
      name: Restmüll-Sensor
      description: Sensor für Restmüll. Optional.
      default: ""
      selector:
        entity:
          domain: sensor

    bio_sensor:
      name: Biomüll-Sensor
      description: Sensor für Biomüll. Optional.
      default: ""
      selector:
        entity:
          domain: sensor

    papier_sensor:
      name: Papier-Sensor
      description: Sensor für Papier. Optional.
      default: ""
      selector:
        entity:
          domain: sensor

    gelb_sensor:
      name: Verpackungs-/Gelber-Sack-Sensor
      description: Sensor für Leichtverpackungen / Gelben Sack. Optional.
      default: ""
      selector:
        entity:
          domain: sensor

    update_time:
      name: Tägliche Aktualisierung
      description: Zu dieser Uhrzeit werden die ausgewählten Werte per MQTT veröffentlicht.
      default: "20:00:00"
      selector:
        time: {}

trigger:
  - platform: time
    at: !input update_time

variables:
  rest_sensor: !input rest_sensor
  bio_sensor: !input bio_sensor
  papier_sensor: !input papier_sensor
  gelb_sensor: !input gelb_sensor

action:

  - if:
      - condition: template
        value_template: "{{ rest_sensor != '' }}"
    then:
      - service: mqtt.publish
        data:
          topic: muell/rest
          payload: "{{ state_attr(rest_sensor, 'daysTo') | int }}"

  - if:
      - condition: template
        value_template: "{{ bio_sensor != '' }}"
    then:
      - service: mqtt.publish
        data:
          topic: muell/bio
          payload: "{{ state_attr(bio_sensor, 'daysTo') | int }}"

  - if:
      - condition: template
        value_template: "{{ papier_sensor != '' }}"
    then:
      - service: mqtt.publish
        data:
          topic: muell/papier
          payload: "{{ state_attr(papier_sensor, 'daysTo') | int }}"

  - if:
      - condition: template
        value_template: "{{ gelb_sensor != '' }}"
    then:
      - service: mqtt.publish
        data:
          topic: muell/gelb
          payload: "{{ state_attr(gelb_sensor, 'daysTo') | int }}"

mode: single
