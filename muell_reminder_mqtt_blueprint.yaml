blueprint:
  name: Müll-Reminder – MQTT Publish (WCS Kalender direkt)
  description: >
    Veröffentlicht die Anzahl der Tage bis zur nächsten Abholung direkt aus
    vier Waste-Collection-Schedule-Kalendern per MQTT.
    Die Berechnung erfolgt anhand des start_time-Attributs des jeweiligen
    WCS-Kalenders. Es werden keine zusätzlichen Template-Sensoren und kein
    daysTo-Attribut benötigt.
  domain: automation

  input:
    calendar_rest:
      name: Restmüll-Kalender
      description: WCS-Kalender für Restmüll
      selector:
        entity:
          domain: calendar

    calendar_bio:
      name: Biomüll-Kalender
      description: WCS-Kalender für Biomüll
      selector:
        entity:
          domain: calendar

    calendar_papier:
      name: Papier-Kalender
      description: WCS-Kalender für Papier
      selector:
        entity:
          domain: calendar

    calendar_gelb:
      name: Gelber-Sack-Kalender
      description: WCS-Kalender für Verpackungen / Gelben Sack
      selector:
        entity:
          domain: calendar

    publish_time:
      name: Tägliche Aktualisierung
      description: >
        Zu dieser Uhrzeit werden alle vier Werte erneut per MQTT veröffentlicht.
      default: "06:00:00"
      selector:
        time: {}

variables:
  calendar_rest: !input calendar_rest
  calendar_bio: !input calendar_bio
  calendar_papier: !input calendar_papier
  calendar_gelb: !input calendar_gelb

trigger:
  - platform: state
    entity_id: !input calendar_rest

  - platform: state
    entity_id: !input calendar_bio

  - platform: state
    entity_id: !input calendar_papier

  - platform: state
    entity_id: !input calendar_gelb

  - platform: time
    at: !input publish_time

  - platform: homeassistant
    event: start

action:
  - service: mqtt.publish
    data:
      topic: muell/rest
      payload: >
        {% set start = state_attr(calendar_rest, 'start_time') %}
        {% if start %}
          {{ (as_datetime(start).date() - now().date()).days }}
        {% else %}
          0
        {% endif %}
      qos: 1
      retain: true

  - service: mqtt.publish
    data:
      topic: muell/bio
      payload: >
        {% set start = state_attr(calendar_bio, 'start_time') %}
        {% if start %}
          {{ (as_datetime(start).date() - now().date()).days }}
        {% else %}
          0
        {% endif %}
      qos: 1
      retain: true

  - service: mqtt.publish
    data:
      topic: muell/papier
      payload: >
        {% set start = state_attr(calendar_papier, 'start_time') %}
        {% if start %}
          {{ (as_datetime(start).date() - now().date()).days }}
        {% else %}
          0
        {% endif %}
      qos: 1
      retain: true

  - service: mqtt.publish
    data:
      topic: muell/gelb
      payload: >
        {% set start = state_attr(calendar_gelb, 'start_time') %}
        {% if start %}
          {{ (as_datetime(start).date() - now().date()).days }}
        {% else %}
          0
        {% endif %}
      qos: 1
      retain: true

mode: restart
