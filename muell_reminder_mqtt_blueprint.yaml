blueprint:
  name: Müll-Reminder – MQTT Publish (WCS Sensoren)
  description: >
    Überträgt die Tage bis zur nächsten Müllabholung aus vier
    Waste-Collection-Schedule-Sensoren per MQTT an den Müll-Reminder.
    Für jede Müllart wird ein WCS-Sensor ausgewählt. Der Blueprint
    liest ausschließlich das daysTo-Attribut des jeweiligen Sensors.
  domain: automation

  input:

    rest_sensor:
      name: Restmüll-Sensor
      description: WCS-Sensor für Restabfall
      selector:
        entity:
          filter:
            - integration: waste_collection_schedule
              domain: sensor

    bio_sensor:
      name: Biomüll-Sensor
      description: WCS-Sensor für Bioabfall
      selector:
        entity:
          filter:
            - integration: waste_collection_schedule
              domain: sensor

    paper_sensor:
      name: Papier-Sensor
      description: WCS-Sensor für Papier
      selector:
        entity:
          filter:
            - integration: waste_collection_schedule
              domain: sensor

    yellow_sensor:
      name: Verpackungs-Sensor
      description: WCS-Sensor für Leichtverpackungen / Gelben Sack
      selector:
        entity:
          filter:
            - integration: waste_collection_schedule
              domain: sensor

    update_time:
      name: Tägliche Aktualisierung
      description: Zu dieser Uhrzeit werden die vier Werte per MQTT veröffentlicht.
      default: "20:00:00"
      selector:
        time:

triggers:
  - trigger: time
    at: !input update_time

actions:

  - variables:
      rest_sensor: !input rest_sensor
      bio_sensor: !input bio_sensor
      paper_sensor: !input paper_sensor
      yellow_sensor: !input yellow_sensor

  - action: mqtt.publish
    data:
      topic: muell/rest
      payload: "{{ state_attr(rest_sensor, 'daysTo') | int(0) }}"
      retain: true

  - action: mqtt.publish
    data:
      topic: muell/bio
      payload: "{{ state_attr(bio_sensor, 'daysTo') | int(0) }}"
      retain: true

  - action: mqtt.publish
    data:
      topic: muell/papier
      payload: "{{ state_attr(paper_sensor, 'daysTo') | int(0) }}"
      retain: true

  - action: mqtt.publish
    data:
      topic: muell/gelb
      payload: "{{ state_attr(yellow_sensor, 'daysTo') | int(0) }}"
      retain: true

mode: single
