blueprint:
  name: Müll-Reminder – MQTT Publish (WCS Kalender)
  description: >
    Ermittelt die nächsten Abholtage für Restmüll, Biomüll, Papier und
    Gelben Sack aus frei wählbaren Waste-Collection-Schedule-Kalendern
    und veröffentlicht die Anzahl der Tage bis zur nächsten Abholung
    per MQTT. Ein Kalender kann für mehrere Müllarten verwendet werden.
  domain: automation
  homeassistant:
    min_version: "2024.6.0"

  input:

    rest_calendar:
      name: Restmüll-Kalender
      description: >
        WCS-Kalender für Restmüll. Darf auch ein gemeinsamer
        Kalender mit mehreren Müllarten sein.
      selector:
        entity:
          filter:
            - domain: calendar

    bio_calendar:
      name: Biomüll-Kalender
      description: >
        WCS-Kalender für Biomüll. Darf auch ein gemeinsamer
        Kalender mit mehreren Müllarten sein.
      selector:
        entity:
          filter:
            - domain: calendar

    paper_calendar:
      name: Papier-Kalender
      description: >
        WCS-Kalender für Papier. Darf auch ein gemeinsamer
        Kalender mit mehreren Müllarten sein.
      selector:
        entity:
          filter:
            - domain: calendar

    yellow_calendar:
      name: Gelber-Sack-Kalender
      description: >
        WCS-Kalender für Gelben Sack / Verpackungen. Darf auch
        ein gemeinsamer Kalender mit mehreren Müllarten sein.
      selector:
        entity:
          filter:
            - domain: calendar

    update_time:
      name: Tägliche Aktualisierung
      description: Uhrzeit, zu der die vier Werte neu ermittelt und per MQTT veröffentlicht werden.
      default: "20:00:00"
      selector:
        time:

triggers:
  - trigger: time
    at: !input update_time

actions:

  # Alle vier Kalender abfragen.
  # Mehrfach ausgewählte Kalender werden von Home Assistant
  # nur einmal zurückgeliefert.
  - action: calendar.get_events
    target:
      entity_id:
        - !input rest_calendar
        - !input bio_calendar
        - !input paper_calendar
        - !input yellow_calendar
    data:
      start_date_time: "{{ today_at() }}"
      duration:
        days: 370
    response_variable: wcs_events

  # RESTMÜLL
  - variables:
      rest_days: >-
        {% set ns = namespace(events=[]) %}

        {% for calendar in wcs_events.values() %}
          {% for event in calendar.events %}
            {% set summary = event.summary | default('') | lower %}

            {% if
              'restmüll' in summary
              or 'restmuell' in summary
              or 'restabfall' in summary
            %}
              {% set ns.events = ns.events + [event] %}
            {% endif %}
          {% endfor %}
        {% endfor %}

        {% set events = ns.events
          | sort(attribute='start')
          | list %}

        {% if events | length > 0 %}
          {% set date = as_datetime(events[0].start) | as_local | as_datetime %}
          {{ (date.date() - now().date()).days }}
        {% else %}
          0
        {% endif %}

  # BIOMÜLL
  - variables:
      bio_days: >-
        {% set ns = namespace(events=[]) %}

        {% for calendar in wcs_events.values() %}
          {% for event in calendar.events %}
            {% set summary = event.summary | default('') | lower %}

            {% if
              'biomüll' in summary
              or 'biomuell' in summary
              or 'biotonne' in summary
            %}
              {% set ns.events = ns.events + [event] %}
            {% endif %}
          {% endfor %}
        {% endfor %}

        {% set events = ns.events
          | sort(attribute='start')
          | list %}

        {% if events | length > 0 %}
          {% set date = as_datetime(events[0].start) | as_local | as_datetime %}
          {{ (date.date() - now().date()).days }}
        {% else %}
          0
        {% endif %}

  # PAPIER
  - variables:
      paper_days: >-
        {% set ns = namespace(events=[]) %}

        {% for calendar in wcs_events.values() %}
          {% for event in calendar.events %}
            {% set summary = event.summary | default('') | lower %}

            {% if
              'papier' in summary
              or 'papiertonne' in summary
              or 'altpapier' in summary
            %}
              {% set ns.events = ns.events + [event] %}
            {% endif %}
          {% endfor %}
        {% endfor %}

        {% set events = ns.events
          | sort(attribute='start')
          | list %}

        {% if events | length > 0 %}
          {% set date = as_datetime(events[0].start) | as_local | as_datetime %}
          {{ (date.date() - now().date()).days }}
        {% else %}
          0
        {% endif %}

  # GELBER SACK / VERPACKUNGEN
  - variables:
      yellow_days: >-
        {% set ns = namespace(events=[]) %}

        {% for calendar in wcs_events.values() %}
          {% for event in calendar.events %}
            {% set summary = event.summary | default('') | lower %}

            {% if
              'gelb' in summary
              or 'verpack' in summary
              or 'wertstoff' in summary
            %}
              {% set ns.events = ns.events + [event] %}
            {% endif %}
          {% endfor %}
        {% endfor %}

        {% set events = ns.events
          | sort(attribute='start')
          | list %}

        {% if events | length > 0 %}
          {% set date = as_datetime(events[0].start) | as_local | as_datetime %}
          {{ (date.date() - now().date()).days }}
        {% else %}
          0
        {% endif %}

  # MQTT
  - action: mqtt.publish
    data:
      topic: muell/rest
      payload: "{{ rest_days | int }}"
      retain: true

  - action: mqtt.publish
    data:
      topic: muell/bio
      payload: "{{ bio_days | int }}"
      retain: true

  - action: mqtt.publish
    data:
      topic: muell/papier
      payload: "{{ paper_days | int }}"
      retain: true

  - action: mqtt.publish
    data:
      topic: muell/gelb
      payload: "{{ yellow_days | int }}"
      retain: true

mode: single
