blueprint:
  name: "Müll-Reminder – MQTT Publish (WCS Kalender)"
  description: >
    Ermittelt die nächsten Abholtage aus zwei Waste-Collection-Schedule-
    Kalendern und veröffentlicht sie per MQTT.
    
    Restmüll wird aus dem separaten Restmüll-Kalender gelesen.
    Biomüll, Papier und Verpackungen werden aus dem gemeinsamen
    "Alle"-Kalender anhand des Veranstaltungstitels herausgefiltert.
    
    Es werden keine zusätzlichen Template-Sensoren und kein days_to-
    Attribut benötigt.
  domain: automation
  author: "NeMPS"

  input:

    rest_calendar:
      name: Restmüll-Kalender
      description: WCS-Kalender, der ausschließlich Restmüll enthält.
      selector:
        entity:
          filter:
            - domain: calendar

    all_calendar:
      name: Alle-Müllarten-Kalender
      description: >
        WCS-Kalender mit Biomüll, Papier und Verpackungen/Gelbem Sack.
      selector:
        entity:
          filter:
            - domain: calendar

    update_time:
      name: Tägliche Aktualisierung
      description: Zu dieser Uhrzeit werden die vier Werte neu ermittelt.
      default: "20:00:00"
      selector:
        time:

mode: single

variables:
  rest_calendar: !input rest_calendar
  all_calendar: !input all_calendar

triggers:
  - trigger: time
    at: !input update_time

actions:

  # ============================================================
  # Alle kommenden Termine aus beiden WCS-Kalendern holen
  # ============================================================

  - action: calendar.get_events
    target:
      entity_id:
        - !input rest_calendar
        - !input all_calendar
    data:
      start_date_time: "{{ today_at('00:00:00') }}"
      duration:
        days: 366
    response_variable: wcs_events

  # ============================================================
  # Nächste Termine je Müllart bestimmen
  # ============================================================

  - variables:

      rest_days: >
        {% set events = wcs_events[rest_calendar]['events'] | default([]) %}
        {% set ns = namespace(best=none) %}

        {% for event in events %}
          {% set d = as_datetime(event.start).date() %}

          {% if ns.best is none or d < ns.best %}
            {% set ns.best = d %}
          {% endif %}
        {% endfor %}

        {% if ns.best is not none %}
          {{ (ns.best - now().date()).days }}
        {% else %}
          {{ none }}
        {% endif %}

      bio_days: >
        {% set events = wcs_events[all_calendar]['events'] | default([]) %}
        {% set ns = namespace(best=none) %}

        {% for event in events %}
          {% set text = event.summary | default('') | lower %}
          {% set d = as_datetime(event.start).date() %}

          {% if 'bio' in text %}
            {% if ns.best is none or d < ns.best %}
              {% set ns.best = d %}
            {% endif %}
          {% endif %}
        {% endfor %}

        {% if ns.best is not none %}
          {{ (ns.best - now().date()).days }}
        {% else %}
          {{ none }}
        {% endif %}

      papier_days: >
        {% set events = wcs_events[all_calendar]['events'] | default([]) %}
        {% set ns = namespace(best=none) %}

        {% for event in events %}
          {% set text = event.summary | default('') | lower %}
          {% set d = as_datetime(event.start).date() %}

          {% if 'papier' in text %}
            {% if ns.best is none or d < ns.best %}
              {% set ns.best = d %}
            {% endif %}
          {% endif %}
        {% endfor %}

        {% if ns.best is not none %}
          {{ (ns.best - now().date()).days }}
        {% else %}
          {{ none }}
        {% endif %}

      gelb_days: >
        {% set events = wcs_events[all_calendar]['events'] | default([]) %}
        {% set ns = namespace(best=none) %}

        {% for event in events %}
          {% set text = event.summary | default('') | lower %}
          {% set d = as_datetime(event.start).date() %}

          {% if 'verpack' in text or 'gelb' in text %}
            {% if ns.best is none or d < ns.best %}
              {% set ns.best = d %}
            {% endif %}
          {% endif %}
        {% endfor %}

        {% if ns.best is not none %}
          {{ (ns.best - now().date()).days }}
        {% else %}
          {{ none }}
        {% endif %}

  # ============================================================
  # MQTT: Restmüll
  # ============================================================

  - if:
      - condition: template
        value_template: "{{ rest_days is not none }}"
    then:
      - action: mqtt.publish
        data:
          topic: "muell/rest"
          payload: "{{ rest_days | int }}"

  # ============================================================
  # MQTT: Biomüll
  # ============================================================

  - if:
      - condition: template
        value_template: "{{ bio_days is not none }}"
    then:
      - action: mqtt.publish
        data:
          topic: "muell/bio"
          payload: "{{ bio_days | int }}"

  # ============================================================
  # MQTT: Papier
  # ============================================================

  - if:
      - condition: template
        value_template: "{{ papier_days is not none }}"
    then:
      - action: mqtt.publish
        data:
          topic: "muell/papier"
          payload: "{{ papier_days | int }}"

  # ============================================================
  # MQTT: Gelber Sack / Verpackungen
  # ============================================================

  - if:
      - condition: template
        value_template: "{{ gelb_days is not none }}"
    then:
      - action: mqtt.publish
        data:
          topic: "muell/gelb"
          payload: "{{ gelb_days | int }}"
